# kind create cluster --name learn --config kind-cluster.yaml
# 1 control-plane + 2 workers. Ports 80/443 are mapped so Ingress works on localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    labels:
      zone: zone-a
  - role: worker
    labels:
      zone: zone-b
