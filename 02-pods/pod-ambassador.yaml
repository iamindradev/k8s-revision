# AMBASSADOR pattern
# The app always talks to localhost:6379. The ambassador (socat) forwards that to the real Redis
# Service. To point the app at a different Redis (another env, a managed service), change ONLY the
# ambassador. The app is untouched.
#
#   kubectl apply -f pod-ambassador.yaml
#   kubectl logs ambassador-demo -c app -f      # PONG / counter values coming back through localhost
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7.4
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - port: 6379
---
apiVersion: v1
kind: Pod
metadata:
  name: ambassador-demo
spec:
  containers:
    # Main app: only knows about localhost
    - name: app
      image: redis:7.4                 # used only for the redis-cli client
      command: ["sh", "-c"]
      args:
        - |
          until redis-cli -h 127.0.0.1 -p 6379 ping; do echo "waiting for ambassador"; sleep 2; done
          while true; do
            echo "visits=$(redis-cli -h 127.0.0.1 -p 6379 incr visits)"
            sleep 3
          done
    # Ambassador: listens on localhost:6379 and forwards to the real backend
    - name: ambassador
      image: alpine/socat:1.8.0.0
      args:
        - "TCP-LISTEN:6379,fork,reuseaddr"
        - "TCP:redis:6379"              # change this to switch backends (e.g. a managed Redis host)
      ports:
        - containerPort: 6379
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }
