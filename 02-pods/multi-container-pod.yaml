# Sidecar pattern: the writer appends to a file, and the sidecar tails it.
# Both share an emptyDir volume and the same network (localhost).
#   kubectl logs multi -c sidecar -f
apiVersion: v1
kind: Pod
metadata:
  name: multi
spec:
  volumes:
    - name: logs
      emptyDir: {}
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /var/log/app.log; sleep 2; done"]
      volumeMounts:
        - name: logs
          mountPath: /var/log
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "tail -F /var/log/app.log"]
      volumeMounts:
        - name: logs
          mountPath: /var/log
