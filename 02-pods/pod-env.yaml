# Environment variables, including the Downward API (pod metadata exposed to the container)
apiVersion: v1
kind: Pod
metadata:
  name: env-demo
  labels:
    app: env-demo
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "env | sort; sleep 3600"]
      env:
        - name: GREETING
          value: "hello"
        - name: MESSAGE
          value: "$(GREETING) world"          # refers to an earlier var
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MEM_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: app
              resource: limits.memory
      resources:
        limits:
          memory: 64Mi
          cpu: 100m
