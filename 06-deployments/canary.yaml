# Canary by replica ratio: the Service selects only app=shop, so traffic splits about 4:1.
#   for i in $(seq 10); do kubectl exec deploy/shop-stable -- wget -qO- shop:5678; done
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-stable
spec:
  replicas: 4
  selector:
    matchLabels: { app: shop, track: stable }
  template:
    metadata:
      labels: { app: shop, track: stable }
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-text=stable", "-listen=:5678"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-canary
spec:
  replicas: 1
  selector:
    matchLabels: { app: shop, track: canary }
  template:
    metadata:
      labels: { app: shop, track: canary }
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-text=canary", "-listen=:5678"]
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector:
    app: shop
  ports:
    - port: 5678
