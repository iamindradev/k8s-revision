apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    env: dev
    # Pod Security Admission (see topic 24)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    env: prod
    pod-security.kubernetes.io/enforce: restricted
